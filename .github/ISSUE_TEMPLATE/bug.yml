name: Token Flexer bug
description: Report a reproducible defect or regression
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Enter …
        3. Select …
        4. Observe …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Token input / Flex Engine
        - Reveal / meme rendering
        - Scoreboard / history
        - Email preview / delivery
        - Automation / unsubscribe
        - Deployment / build
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and deployment
      placeholder: Safari 19, iPhone, production
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Delivery or privacy impact
      description: If this could duplicate email, expose data, or bypass suppression, say so explicitly.
    validations:
      required: true
