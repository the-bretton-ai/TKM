name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first — the older run's verdict
# is about code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Separate steps so a red check names the thing that broke, rather than
      # making someone open the log to find out which half of `npm run check` failed.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npx vite build

      - name: Secret scan
        run: node scripts/secret-scan.mjs
